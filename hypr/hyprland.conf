# Nightmare's Hyprland config - Joy Division edition :3
# machine-specific overrides (GPU env vars etc.) — not synced to git
source = $HOME/.config/hypr/machine.conf

##############
### MONITORS ###
##############

monitor = DP-3, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 1920x1080, 1920x0, 1
monitor = , preferred, auto, 1

###############
### PROGRAMS ###
###############

$mod    = SUPER
$term   = kitty
$menu   = pgrep wofi >/dev/null 2>&1 && killall wofi || wofi --show drun --location=top -y 48
$browser       = firefox
$file_explorer = nautilus
$lock          = hyprlock
$osd           = /home/nightmare/.config/eww/scripts/osd.sh

$left  = A
$right = D
$up    = W
$down  = S

###############
### AUTOSTART ###
###############

exec-once = eww daemon
exec-once = playerctld daemon
exec-once = waybar
exec-once = swaybg -i /home/nightmare/Wallpapers/joy_division_02.jpeg -m fill
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark

###############
### ENV VARS ###
###############

env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = QT_QPA_PLATFORM, wayland
env = GDK_BACKEND, wayland
env = XDG_SESSION_TYPE, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland

#######################
### LOOK AND FEEL ###
#######################

general {
    gaps_in  = 10
    gaps_out = 10
    border_size = 1

    col.active_border   = rgba(332F36ff)
    col.inactive_border = rgba(151317ff)

    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 6

    active_opacity   = 1.0
    inactive_opacity = 0.86

    blur {
        enabled  = true
        size     = 5
        passes   = 2
    }

    shadow {
        enabled        = true
        range          = 24
        render_power   = 3
        color          = rgba(000000cc)
        color_inactive = rgba(00000033)
    }
}

animations {
    enabled = true

    # short, mechanical movement
    bezier = snap,   0.16, 1.00, 0.30, 1.00
    bezier = cutOut, 0.55, 0.00, 1.00, 0.45
    bezier = drift,  0.22, 0.75, 0.30, 1.00

    # windows
    animation = windowsIn,   1, 3, snap,   popin 94%
    animation = windowsOut,  1, 2, cutOut, popin 96%
    animation = windowsMove, 1, 2, snap

    # fades
    animation = fadeIn,     1, 2, snap
    animation = fadeOut,    1, 2, cutOut
    animation = fadeSwitch, 1, 2, snap

    # shell layers
    animation = layersIn,  1, 3, snap,   popin 98%
    animation = layersOut, 1, 2, cutOut, popin 98%

    # workspaces
    animation = workspaces,       1, 3, drift, slidefade 14%
    animation = specialWorkspace, 1, 3, snap,  slidefadevert 18%

    # focus change
    animation = border, 1, 3, snap
}

input {
    kb_layout   = cz
    follow_mouse = 1
    sensitivity  = 0
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
}

debug {
    disable_logs = false
}

###################
### KEYBINDINGS ###
###################

# basics
bind = $mod,       Return, exec,          $term
bind = $mod,       Q,      killactive
bind = $mod,       SPACE,  exec,          $menu
bind = $mod,       B,      exec,          $browser
bind = $mod,       E,      exec,          $file_explorer
bind = $mod,       F,      fullscreen
bind = $mod,       V,      togglefloating
bind = $mod,       L,      exec,          $lock
bind = $mod,       R,      submap,        resize
bind = $mod SHIFT, SPACE,  togglefloating
bind = $mod SHIFT, E,      exit
bind = $mod,       D,      exec,          /home/nightmare/.config/eww/scripts/toggle_signalstrip.sh

# screenshot
bind = ALT SHIFT, S,   exec, /home/nightmare/.config/sway/screenshot.sh
bind = ,          Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && notify-send "Screenshot" "Saved to Pictures/Screenshots"
bind = CTRL,      Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"

# clipboard history
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu -p "Clipboard" | cliphist decode | wl-copy

# color picker
bind = $mod, P, exec, hyprpicker -a && notify-send "Color Picker" "Color copied to clipboard"

# alt-tab
bind = ALT, Tab,       cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# reload waybar
bind = $mod SHIFT, C, exec, pkill waybar; waybar &

# move focus
bind = $mod, $left,  movefocus, l
bind = $mod, $down,  movefocus, d
bind = $mod, $up,    movefocus, u
bind = $mod, $right, movefocus, r
bind = $mod, left,   movefocus, l
bind = $mod, down,   movefocus, d
bind = $mod, up,     movefocus, u
bind = $mod, right,  movefocus, r

# move windows
bind = $mod SHIFT, $left,  movewindow, l
bind = $mod SHIFT, $down,  movewindow, d
bind = $mod SHIFT, $up,    movewindow, u
bind = $mod SHIFT, $right, movewindow, r
bind = $mod SHIFT, left,   movewindow, l
bind = $mod SHIFT, down,   movewindow, d
bind = $mod SHIFT, up,     movewindow, u
bind = $mod SHIFT, right,  movewindow, r

# workspaces — use keycodes (layout-independent, Czech kb puts numbers on Shift)
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod, code:19, workspace, 10

bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod SHIFT, code:19, movetoworkspace, 10

# scratchpad
bind = $mod,       minus, togglespecialworkspace, magic
bind = $mod SHIFT, minus, movetoworkspace,        special:magic

# resize submap
submap = resize
binde = , $left,  resizeactive, -20  0
binde = , $right, resizeactive,  20  0
binde = , $up,    resizeactive,  0  -20
binde = , $down,  resizeactive,  0   20
binde = , left,   resizeactive, -20  0
binde = , right,  resizeactive,  20  0
binde = , up,     resizeactive,  0  -20
binde = , down,   resizeactive,  0   20
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
submap = reset

# mouse window drag/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# audio
bindel = , XF86AudioLowerVolume, exec, $osd volume-down
bindel = , XF86AudioRaiseVolume, exec, $osd volume-up
bindl  = , XF86AudioMute,        exec, $osd volume-toggle
bindl  = , XF86AudioMicMute,     exec, $osd microphone-toggle
bindl  = , XF86AudioPlay,        exec, playerctl -p playerctld play-pause
bindl  = , XF86AudioPrev,        exec, playerctl -p playerctld previous
bindl  = , XF86AudioNext,        exec, playerctl -p playerctld next

# brightness
bindel = , XF86MonBrightnessDown, exec, $osd brightness-down
bindel = , XF86MonBrightnessUp,   exec, $osd brightness-up

###################
### WINDOW RULES ###
###################


# float common utility windows
windowrule = float = true;   class = pavucontrol
windowrule = size = 700 450; class = pavucontrol
windowrule = center = true;  class = pavucontrol

windowrule = float = true;   class = org.gnome.Nautilus
windowrule = size = 900 600; class = org.gnome.Nautilus
windowrule = center = true;  class = org.gnome.Nautilus

windowrule = float = true;   class = nm-connection-editor
windowrule = center = true;  class = nm-connection-editor

windowrule = float = true;   class = blueman-manager
windowrule = center = true;  class = blueman-manager

# file/save dialogs always float and center
windowrule = float = true;  title = ^(Open File)(.*)$
windowrule = float = true;  title = ^(Save File)(.*)$
windowrule = float = true;  title = ^(Save As)(.*)$
windowrule = float = true;  title = ^(Select)(.*)$
windowrule = center = true; title = ^(Open File)(.*)$
windowrule = center = true; title = ^(Save File)(.*)$
windowrule = center = true; title = ^(Save As)(.*)$

# picture-in-picture
windowrule = float = true;              title = ^(Picture-in-Picture)$
windowrule = pin = true;                title = ^(Picture-in-Picture)$
windowrule = size = 480 270;            title = ^(Picture-in-Picture)$
windowrule = move = 100%-490 100%-280;  title = ^(Picture-in-Picture)$
