general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = false
}

background {
    monitor =
    path = /home/nightmare/Wallpapers/joy_division_02.jpeg
    blur_passes = 3
    blur_size = 7
    brightness = 0.4
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(C4D8E8ff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(4A90D9ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(4A90D9ff)
    inner_color = rgba(0F0F0Fff)
    font_color = rgba(C4D8E8ff)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    check_color = rgba(4A90D9ff)
    fail_color = rgba(8A2C2Cff)
    fail_text = <i>wrong ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
